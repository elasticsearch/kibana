openapi: 3.0.0
info:
  title: Get Example Scores API endpoint
  version: "1"
paths:
  /internal/evals/examples/{exampleId}/scores:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetExampleScores
      description: Get score documents for a specific example across experiments
      summary: Get example scores
      tags:
        - Evals API
      parameters:
        - name: exampleId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: dataset_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          description: Filter scores to a specific dataset. When omitted, scores from all datasets matching the example ID are returned.
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: Filter by execution ID (the full composite execution identifier)
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by task model ID
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: array
                    items:
                      $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluationScoreDocument'
                  total:
                    type: integer
                required:
                  - scores
                  - total
