openapi: 3.0.0
info:
  title: Delete Evaluator API endpoint
  version: '1'
paths:
  /internal/evals/evaluators/{name}:
    delete:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: DeleteEvaluator
      description: >-
        Delete a user-defined evaluator. Without a version every version of the
        name is removed, because one left behind would still resolve through
        `name@version` and outlive the delete. Built-in evaluators cannot be
        deleted.
      summary: Delete evaluator
      tags:
        - Evals API
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorName'
        - name: version
          in: query
          required: false
          description: Limits the delete to one version.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                    minimum: 0
                    description: How many stored versions were removed.
                required:
                  - success
                  - deleted
        '404':
          description: Evaluator not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Built-in evaluators cannot be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
