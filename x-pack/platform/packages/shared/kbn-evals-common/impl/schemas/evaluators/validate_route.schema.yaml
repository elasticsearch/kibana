openapi: 3.0.0
info:
  title: Validate Evals Evaluator Evidence API endpoint
  version: '1'
paths:
  /internal/evals/evaluators/_validate:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: Validate
      description: Validates evaluator evidence requirements against a trace
      summary: Validate evaluator evidence
      tags:
        - Evals API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject
                - evaluators
              properties:
                subject:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluationSubject'
                evaluators:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        maxLength: 256
                      version:
                        type: string
                        maxLength: 64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - evaluators
                properties:
                  evaluators:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - ready
                        - unmet
                      properties:
                        name:
                          type: string
                          maxLength: 256
                        version:
                          type: string
                          maxLength: 64
                        ready:
                          type: boolean
                        unmet:
                          type: array
                          items:
                            type: string
                            maxLength: 1024
                        remediation:
                          type: string
                          maxLength: 2048
