openapi: 3.0.0
info:
  title: Evals Common Attributes
  version: '1'
paths: {}
components:
  schemas:
    DatasetTags:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9:._-]*$'
      description: >-
        Free-form labels used to organize datasets. Tags are lowercased and
        deduplicated on write, so `Golden` and `golden` are the same tag.
        Commas are not allowed because tag filters are comma-separated.
        Tags describe what a dataset is about; they never affect who can see it.

    Direction:
      type: string
      enum:
        - maximize
        - minimize
        - neutral
      description: >-
        Metric polarity. `maximize` means a higher score is better (e.g. faithfulness,
        accuracy). `minimize` means a lower score is better (e.g. latency, token count).
        `neutral` means the metric is informational only and has no improvement direction.

    DatasetMaturity:
      type: string
      enum:
        - raw
        - cleaned
        - golden
      description: >-
        How curated the dataset is, from raw captures through cleaned data to
        "golden" reference datasets. Absent when a dataset has no maturity set.

    SpaceIds:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 256
      description: >-
        Spaces the dataset is assigned to. Each id must name an existing space
        the caller can manage evaluations in; wildcards are not accepted, so
        every space is listed. Defaults to the space the request was made in,
        taken from the URL's `/s/` prefix and the default space without one.
        Absent in a response means the default space.

    RedactedSpaceIds:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 256
      description: >-
        Spaces the dataset is assigned to, with each id the caller cannot access
        replaced by `?`, so the entries still count the spaces.

    DatasetFacetBucket:
      type: object
      properties:
        value:
          type: string
          maxLength: 64
        count:
          type: integer
      required:
        - value
        - count

    DatasetFacets:
      type: object
      description: >-
        Values available to filter on, with the number of datasets carrying
        each. Counts reflect the current search term but ignore the tag and
        maturity filters, so they stay stable while filters are toggled.
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/DatasetFacetBucket'
        maturity:
          type: array
          items:
            $ref: '#/components/schemas/DatasetFacetBucket'
      required:
        - tags
        - maturity

    Model:
      type: object
      properties:
        id:
          type: string
          maxLength: 256
        family:
          type: string
          maxLength: 256
        provider:
          type: string
          maxLength: 256
      required:
        - id

    EvaluationScoreDocument:
      type: object
      properties:
        '@timestamp':
          type: string
          maxLength: 64
        experiment_id:
          type: string
          maxLength: 1024
        experiment_name:
          type: string
          maxLength: 256
        space_ids:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 256
          nullable: true
          description: >-
            Spaces this score belongs to. Absent on documents created before
            space-awareness was introduced (those are treated as the default space).
        example:
          $ref: '#/components/schemas/ExampleInfo'
        task:
          $ref: '#/components/schemas/TaskInfo'
        evaluator:
          $ref: '#/components/schemas/EvaluatorInfo'
        metadata:
          $ref: '#/components/schemas/ScoreMetadata'
      required:
        - '@timestamp'
        - experiment_id
        - example
        - task
        - evaluator
        - metadata

    BuildkiteMetadata:
      type: object
      properties:
        build_id:
          type: string
          maxLength: 256
        job_id:
          type: string
          maxLength: 256
        build_url:
          type: string
          maxLength: 2048
        pipeline_slug:
          type: string
          maxLength: 256
        pull_request:
          type: string
          maxLength: 64
        branch:
          type: string
          maxLength: 256
        commit:
          type: string
          maxLength: 256

    ExampleInfo:
      type: object
      properties:
        id:
          type: string
          maxLength: 1024
        index:
          type: integer
        input:
          type: object
          additionalProperties: true
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        dataset:
          type: object
          properties:
            id:
              type: string
              maxLength: 1024
            name:
              type: string
              maxLength: 256
          required:
            - id
            - name
      required:
        - id
        - index
        - dataset

    TaskInfo:
      type: object
      properties:
        trace_id:
          type: string
          maxLength: 256
          nullable: true
        repetition_index:
          type: integer
        output:
          type: object
          additionalProperties: true
          nullable: true
        model:
          $ref: '#/components/schemas/Model'
      required:
        - repetition_index
        - model

    EvaluatorInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        version:
          type: string
          maxLength: 64
          description: >-
            The evaluator version that produced the score, so a run stays
            reproducible after the definition moves on. Absent on documents
            written before the version was recorded.
        score:
          type: number
          nullable: true
        label:
          type: string
          maxLength: 256
          nullable: true
        explanation:
          type: string
          maxLength: 4096
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        trace_id:
          type: string
          maxLength: 256
          nullable: true
        direction:
          $ref: '#/components/schemas/Direction'
        model:
          $ref: '#/components/schemas/Model'
        kind:
          type: string
          enum:
            - llm
            - code
          description: >-
            Whether the evaluator invoked a model. Absent on documents written
            before per-evaluator attribution was introduced.
      required:
        - name

    ScoreMetadata:
      type: object
      properties:
        execution_id:
          type: string
          maxLength: 1024
        suite_id:
          type: string
          maxLength: 256
        total_repetitions:
          type: integer
        hostname:
          type: string
          maxLength: 256
        git:
          type: object
          properties:
            branch:
              type: string
              maxLength: 256
              nullable: true
            commit_sha:
              type: string
              maxLength: 256
              nullable: true
        ci:
          $ref: '#/components/schemas/BuildkiteMetadata'
      required:
        - total_repetitions

    EvaluatorStats:
      type: object
      properties:
        dataset_id:
          type: string
          maxLength: 1024
        dataset_name:
          type: string
          maxLength: 256
        evaluator_name:
          type: string
          maxLength: 256
        example_count:
          type: integer
          minimum: 0
          default: 0
          description: Number of unique examples evaluated in this dataset
        evaluator_model:
          $ref: '#/components/schemas/Model'
          description: >-
            Model this evaluator judged with. Absent for code evaluators, which
            invoke no model.
        stats:
          type: object
          properties:
            mean:
              type: number
            median:
              type: number
            std_dev:
              type: number
            min:
              type: number
            max:
              type: number
            count:
              type: integer
          required:
            - mean
            - median
            - std_dev
            - min
            - max
            - count
      required:
        - dataset_id
        - dataset_name
        - evaluator_name
        - stats

    EvaluatorName:
      type: string
      minLength: 2
      maxLength: 128
      pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$'
      description: >-
        Identifies the evaluator. Lowercase so a lookup cannot miss on case, and
        never opening with an underscore so a name cannot be read as an action
        path. Cannot be the name of a built-in evaluator.

    EvaluatorOrigin:
      type: string
      enum:
        - built_in
        - user_defined
      description: >-
        Whether the evaluator ships with Kibana or was defined by a user.
        Built-in evaluators are read-only.

    EvaluationTraceId:
      type: string
      maxLength: 32
      pattern: '^[0-9a-fA-F]{32}$'
      description: A 128-bit OpenTelemetry trace identifier encoded as 32 hexadecimal characters.

    EvaluationInstrumentationProfile:
      type: string
      enum:
        - elastic-inference
        - otel-genai-events
        - otel-genai-attributes
        - claude-code

    EvaluationSubject:
      type: object
      required:
        - traces
      properties:
        mode:
          type: string
          enum:
            - single-turn
            - multi-turn
          default: single-turn
        traces:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
              - trace_id
            properties:
              trace_id:
                $ref: '#/components/schemas/EvaluationTraceId'
              reference_data:
                type: object
                additionalProperties: true
        instrumentation:
          type: object
          description: >-
            Optional instrumentation profile selection. When omitted, the
            elastic-inference profile is used.
          required:
            - profile
          properties:
            profile:
              $ref: '#/components/schemas/EvaluationInstrumentationProfile'
              default: elastic-inference

    JudgeEvidence:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        enum:
          - input
          - response
          - steps
      description: >-
        Which parts of the normalized trace the judge is shown, and therefore
        requires: the user query (`input`), the agent response (`response`), and
        the tool calls (`steps`). Rendered into the prompt as `user_query`,
        `agent_response`, and `tool_calls`. A trace missing any of them is
        reported as unmet rather than judged.

    JudgeScore:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 127
          description: >-
            Score name. Limited so `evaluator.score` fits the score document's
            evaluator-name field even when the evaluator name is at its limit.
        type:
          type: string
          enum:
            - number
            - categorical
          description: >-
            `number` asks the judge for a value between 0 and 1. `categorical`
            asks it to pick one of `labels`, which carry the numeric value each
            label is worth.
        labels:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              value:
                type: string
                minLength: 1
                maxLength: 256
              score:
                type: number
                minimum: 0
                maximum: 1
            required:
              - value
              - score
        description:
          type: string
          maxLength: 2048
      required:
        - name
        - type

    LlmJudgeConfig:
      type: object
      description: >-
        What a user-defined judge is given and what it must report back. The
        prompt is a Mustache template and may only reference the evidence and
        reference data keys the config declares.
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32768
          description: >-
            Mustache template for the evaluation request. Use unescaped
            interpolation (`{{{variable}}}` or `{{& variable}}`) for evidence
            and reference data so their contents are not HTML-escaped.
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
          description: >-
            System instructions for the judge. Required so every immutable
            evaluator version contains its complete prompt configuration. Use
            unescaped Mustache interpolation (`{{{variable}}}` or
            `{{& variable}}`) when inserting evidence or reference data.
        evidence:
          $ref: '#/components/schemas/JudgeEvidence'
        reference_data_keys:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '^[a-zA-Z_][a-zA-Z0-9_-]*$'
          description: >-
            Keys the example's reference data must supply, each exposed to the
            prompt under its own name. An example missing one is refused before
            a model is called.
        output:
          type: object
          properties:
            scores:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/JudgeScore'
          required:
            - scores
      required:
        - prompt
        - system_prompt
        - evidence
        - output

    UserDefinedEvaluatorDraft:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/EvaluatorName'
        description:
          type: string
          minLength: 1
          maxLength: 2048
        judge:
          $ref: '#/components/schemas/LlmJudgeConfig'
      required:
        - name
        - description
        - judge

    PersistedEvaluator:
      type: object
      description: A persisted evaluator definition.
      properties:
        name:
          $ref: '#/components/schemas/EvaluatorName'
        version:
          type: string
          maxLength: 64
        kind:
          type: string
          enum:
            - llm
        origin:
          $ref: '#/components/schemas/EvaluatorOrigin'
        description:
          type: string
          maxLength: 2048
        judge:
          $ref: '#/components/schemas/LlmJudgeConfig'
        created_at:
          type: string
          maxLength: 64
        updated_at:
          type: string
          maxLength: 64
        created_by:
          type: string
          maxLength: 256
          description: User who created this immutable version.
      required:
        - name
        - version
        - kind
        - origin
        - description
        - judge
        - created_at
        - updated_at

    TraceSpan:
      type: object
      properties:
        span_id:
          type: string
          maxLength: 256
        trace_id:
          type: string
          maxLength: 256
        parent_span_id:
          type: string
          maxLength: 256
        name:
          type: string
          maxLength: 256
        kind:
          type: string
          maxLength: 64
        status:
          type: string
          maxLength: 64
        start_time:
          type: string
          maxLength: 64
        end_time:
          type: string
          maxLength: 64
        duration_ms:
          type: number
        attributes:
          type: object
          additionalProperties: true
      required:
        - span_id
        - trace_id
        - name
        - start_time
        - duration_ms
