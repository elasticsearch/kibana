post:
  summary: Delete multiple case comments or alerts
  operationId: bulkDeleteCaseCommentsDefaultSpace
  description: >
    Deletes the attachments identified by `ids` from a case. Any attachment type is accepted,
    including comments, alerts and files. A maximum of 100 attachments can be deleted per
    request. The request fails without deleting anything if any of the identifiers is not an
    attachment of the case.


    You must have `all` privileges for the **Cases** feature in the **Management**,
    **Observability**, or **Security** section of the Kibana feature privileges, depending on
    the owner of the cases you're deleting.
  tags:
    - cases
  parameters:
    - $ref: '../components/headers/kbn_xsrf.yaml'
    - $ref: '../components/parameters/case_id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/bulk_delete_case_comments_request.yaml'
        examples:
          bulkDeleteCaseCommentsRequest:
            $ref: '../components/examples/bulk_delete_case_comments_request.yaml'
  responses:
    '204':
      description: Indicates a successful call.
    '401':
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response401:
              $ref: '../components/examples/response_401.yaml'
    '404':
      description: One or more of the identifiers is not an attachment of the case.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response404:
              $ref: '../components/examples/response_404.yaml'
  x-codeSamples:
    - label: curl
      lang: curl
      source: |
        curl \
          --request POST 'https://localhost:5601/api/cases/9c235210-6834-11ea-a78c-6ffb38a34414/comments/_bulk_delete' \
          --header "Authorization: $API_KEY" \
          --header "Content-Type: application/json" \
          --header "kbn-xsrf: true" \
          --data '{"ids":["71ec1870-725b-11ea-a0b2-c51ea50a58e2"]}'
    - label: Console
      lang: console
      source: |
        POST kbn:/api/cases/9c235210-6834-11ea-a78c-6ffb38a34414/comments/_bulk_delete
        {
          "ids": ["71ec1870-725b-11ea-a0b2-c51ea50a58e2"]
        }
