openapi: 3.0.0
info:
  title: Set alerts status API endpoint
  version: '2023-10-31'
paths:
  /api/detection_engine/signals/status:
    post:
      x-labels: [serverless, ess]
      operationId: SetAlertsStatus
      x-codegen-enabled: true
      summary: Set a detection alert status
      description: Set the status of one or more detection alerts.
      tags:
        - Alerts API
      requestBody:
        description: An object containing desired status and explicit alert ids or a query to select alerts
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SetAlertsStatusByIds'
                - $ref: '#/components/schemas/SetAlertsStatusByQuery'
            examples:
              byId:
                value:
                  status: closed
                  signal_ids: ['80e1383f856e67c1b7f7a1634744fa6d66b6e2ef7aa26d226e57afb5a7b2b4a1']
              byQuery:
                value:
                  conflicts: proceed
                  status: closed
                  query:
                    bool:
                      must: []
                      filter:
                        - range:
                          '@timestamp':
                            gte: 2024-10-23T07:00:00.000Z
                            lte: 2025-01-21T20:12:11.704Z
                            format: strict_date_optional_time
                        - bool:
                            filter:
                              bool:
                                must: []
                                filter:
                                  - match_phrase:
                                      kibana.alert.workflow_status: open
                                  - range:
                                    '@timestamp':
                                      gte: 2024-10-23T07:00:00.000Z
                                      lte: 2025-01-21T20:12:11.704Z
                                      format: strict_date_optional_time
                                should: []
                                must_not:
                                  - exists:
                                      field: kibana.alert.building_block_type
                      should: []
                      must_not: []
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Elasticsearch update by query response
              examples:
                byId:
                  value:
                    took: 81
                    timed_out: false
                    total: 1
                    updated: 1
                    deleted: 0
                    batches: 1
                    version_conflicts: 0
                    noops: 0
                    retries:
                      bulk: 0
                      search: 0
                    throttled_millis: 0
                    requests_per_second: -1
                    throttled_until_millis: 0
                    failures: []
                byQuery:
                  value:
                    took: 100
                    timed_out: false
                    total: 17
                    updated: 17
                    deleted: 0
                    batches: 1
                    version_conflicts: 0
                    noops: 0
                    retries:
                      bulk: 0
                      search: 0
                    throttled_millis: 0
                    requests_per_second: -1
                    throttled_until_millis: 0
                    failures: []
        400:
          description: Invalid input data response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../../model/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
                  - $ref: '../../../model/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: '[request body].signal_ids: at least one alert id is required to update status'
        401:
          description: Unsuccessful authentication response
          content:
            application/json:
              schema:
                $ref: '../../../model/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]"
        500:
          description: Internal server error response
          content:
            application/json:
              schema:
                $ref: '../../../model/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'
              examples:
                serverError:
                  value:
                    message: Internal Server Error
                    status_code: 500

components:
  schemas:
    RuntimeFieldType:
      type: string
      enum:
        - keyword
        - long
        - double
        - date
        - ip
        - boolean
        - geo_point
      description: >-
        The data type for the runtime field type. Determines how the field value is indexed and queried.

    RuntimeFieldMapping:
      type: object
      description: >-
        A single runtime field mapping to be attached verbatim to the
        `_update_by_query` as `runtime_mappings`. Allows the close query to
        reference fields that are not natively mapped on the alerts index but
        are evaluatable at query time by Elasticsearch — for example, scripted
        fields defined on a data view.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RuntimeFieldType'
        script:
          type: object
          additionalProperties: false
          description: >-
            Painless script that Elasticsearch evaluates for each candidate
            document. Only inline scripts (`source`) are accepted — stored
            scripts, parameterised scripts (`params`), and non-default `lang`
            values are not supported. The server rejects any extra properties
            with a 400 to avoid silently changing runtime field semantics.
          required: [source]
          properties:
            source:
              type: string
              description: Painless script source to execute.
              maxLength: 10000
        format:
          type: string
          description: >-
            Optional format string for date runtime fields (e.g.
            `strict_date_optional_time`).
          maxLength: 100
    SetAlertsStatusByIdsBase:
      type: object
      properties:
        signal_ids:
          type: array
          description: 'List of alert ids. Use field `_id` on alert document or `kibana.alert.uuid`. Note: signals are a deprecated term for alerts.'
          items:
            type: string
            format: nonempty
            minLength: 1
          minItems: 1
        status:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/AlertStatusExceptClosed'
      required: [signal_ids, status]

    CloseAlertsByIds:
      type: object
      properties:
        signal_ids:
          type: array
          description: 'List of alert ids. Use field `_id` on alert document or `kibana.alert.uuid`. Note: signals are a deprecated term for alerts.'
          items:
            type: string
            format: nonempty
            minLength: 1
          minItems: 1
        status:
          type: string
          enum: [closed]
        reason:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/Reason'
      required: [signal_ids, status]

    SetAlertsStatusByIds:
      oneOf:
        - $ref: '#/components/schemas/CloseAlertsByIds'
        - $ref: '#/components/schemas/SetAlertsStatusByIdsBase'
      discriminator:
        propertyName: status
        mapping:
          closed: '#/components/schemas/CloseAlertsByIds'

    SetAlertsStatusByQueryBase:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
        status:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/AlertStatusExceptClosed'
        conflicts:
          type: string
          enum:
            - abort
            - proceed
          default: abort
        runtime_fields:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldType'
          description: >-
            Optional map of field name to runtime field type. For each
            entry, a runtime field of the specified type
            is created reading its value from `_source[fieldName]` and included in
            the query as `runtime_mappings`. Use this to reference fields stored on the
            alert `_source` that are not part of the Elastic Common Schema (ECS) of the alerts index mapping,
            for example, custom fields that the rule's source index defined when the alerts were created.
        runtime_mappings:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldMapping'
          description: >-
            Optional map of runtime field name to runtime field mapping.
            For each entry the server forwards `type`, `script.source`, and
            `format` to the underlying `_update_by_query` as `runtime_mappings`,
            so the close query can match fields not natively mapped on the
            alerts index (e.g. data view runtime fields with Painless scripts).
            Unlike `runtime_fields`, the caller-supplied Painless script is
            preserved and executed by Elasticsearch at query time.
            The server always sets `on_script_error: continue` regardless of
            any value supplied by the caller, so a single alert that causes a
            script error is skipped rather than aborting the entire close.
            Limited to 100 unique field names combined with `runtime_fields`;
            larger maps are rejected.
      required: [query, status]

    CloseAlertsByQuery:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [closed]
        conflicts:
          type: string
          enum:
            - abort
            - proceed
          default: abort
        reason:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/Reason'
        runtime_fields:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldType'
          description: >-
            Optional map of field name to runtime field type. For each
            entry, the server defines a runtime field of the given type
            that reads its value from `_source[fieldName]` and attaches it
            to the underlying `_update_by_query` as `runtime_mappings`.
            Allows the `query` to reference non-ECS fields stored on the
            alert `_source` but not in the alerts index mapping — for
            example, runtime fields the rule's source index defined at the
            time the alerts were created. Limited to 100 entries per
            request; larger maps are rejected.
        runtime_mappings:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldMapping'
          description: >-
            Optional map of runtime field name to runtime field mapping.
            For each entry the server forwards `type`, `script.source`, and
            `format` to the underlying `_update_by_query` as `runtime_mappings`,
            so the close query can match fields not natively mapped on the
            alerts index (e.g. data view runtime fields with Painless scripts).
            Unlike `runtime_fields`, the caller-supplied Painless script is
            preserved and executed by Elasticsearch at query time.
            The server always sets `on_script_error: continue` regardless of
            any value supplied by the caller, so a single alert that causes a
            script error is skipped rather than aborting the entire close.
            Limited to 100 unique field names combined with `runtime_fields`;
            larger maps are rejected.
      required: [query, status]

    SetAlertsStatusByQuery:
      oneOf:
        - $ref: '#/components/schemas/CloseAlertsByQuery'
        - $ref: '#/components/schemas/SetAlertsStatusByQueryBase'
      discriminator:
        propertyName: status
        mapping:
          closed: '#/components/schemas/CloseAlertsByQuery'