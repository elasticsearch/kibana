version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives, fans out one
  tuning review workflow per rule so every review holds its own approval gate,
  and joins once every gate has settled to report the decision totals.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  # The limit applies per space. A sweep stays running until analysts answer all
  # its gates (up to 72h). With max 1, the scheduled sweep every 2h would be
  # skipped that whole time and no new rule would get diagnosed; 5 allows that
  # while capping how many sweeps wait. Overlap is safe: the harvest skips rules
  # with an in-flight review.
  concurrency:
    key: detection-rule-tuning
    strategy: drop
    max: 5
triggers:
  # The per-space Rule Tuning worker owns the 2h schedule. This global sweep stays
  # manual-only so there is one scheduler authority and no cross-space task collision.
  - type: manual
    inputs:
      properties:
        autonomy_level:
          type: string
          enum: [manual, assisted]
          default: assisted
          description: >-
            Detection Watch autonomy level of the dispatching worker, forwarded to
            every review it launches. "manual" makes each review wait for an analyst
            before diagnosis.
        min_fp_count:
          type: integer
          # Floor of 2: a single-FP group makes ES|QL return alert_ids as a scalar,
          # which would fail the review's array input schema.
          minimum: 2
          maximum: 100
          description: Overrides the minimum unreviewed false-positive alerts a rule needs before it is diagnosed.
        min_fp_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Overrides the minimum share of a rule's alerts, in percent, that analysts closed as false positives.
        analysis_window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Overrides how many days of alerts feed the analysis.
        preview_invocation_count:
          type: integer
          minimum: 1
          maximum: 10
          description: Overrides the rule executions each backtest preview simulates.
        max_rules_per_sweep:
          type: integer
          minimum: 1
          # Can only lower the cap: the fan-out's parallel slots are sized for the
          # default, so a larger value could not open every gate at once.
          maximum: 10
          description: Overrides how many tuning reviews one sweep may launch, up to the default of 10.
      additionalProperties: false
outputs:
  - name: reviews_requested
    type: number
  - name: reviews_approved
    type: number
  - name: reviews_failed
    type: number
  - name: rules_applied
    type: number
  - name: harvest_failed
    type: boolean
consts:
  # Worker settings. Scheduled runs carry no inputs, so every use goes through
  # `inputs.x | default: consts.x`; a manual run can override any of them.
  analysis_window_days: 14
  min_fp_count: 10
  min_fp_rate_pct: 50
  max_rules_per_sweep: 10
  # The max number of rules to consider for tuning.
  max_candidate_rules: 20
  # Ids handed to the diagnosing agent and tagged once the gate resolves; must
  # match ALERTS_BY_IDS_MAX in the investigate-rule skill (investigate_rule_skill.ts).
  max_diagnosis_ids: 100
  preview_invocation_count: 2
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
  reviewed_tag: detection-watch:tuning-reviewed
steps:
  # A review can outlive its sweep (sweep cancelled or failed while the child sits
  # at its gate, or a review started by hand). Its rule would be re-harvested until
  # the gate resolves, wasting one of the max_rules_per_sweep slots on a branch the
  # child's per-rule drop concurrency then kills. Listing in-flight reviews up front
  # lets the harvest skip those rules at the source. Fails open: without this data the
  # sweep still runs and the drop concurrency remains the backstop.
  - name: list_active_reviews
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/workflows/workflow/system-security-rule-tuning-review/executions?statuses=pending&statuses=waiting&statuses=waiting_for_input&statuses=waiting_for_child&statuses=running&statuses=queued&size=100"
      headers:
        elastic-api-version: "2023-10-31"
    on-failure:
      continue: true

  # The list response carries each execution's concurrencyGroupKey
  # (`rule-tuning-review-<rule uuid>`), not its inputs. Liquid cannot transform array
  # elements one by one, so the keys are joined, stripped of the prefix, and split
  # back. Size is computed on its own because comparison operators cannot follow a
  # filter chain.
  - name: collect_active_rules
    type: data.set
    with:
      parsed: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'rule-tuning-review-' | split: ',' }}"
      parsed_count: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'rule-tuning-review-' | split: ',' | size }}"
      expected: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | size }}"

  # A key containing the `,` separator would corrupt the split into fragments that
  # could match unrelated rules (uuids never do, but the keys are external data), so
  # the parse only counts when it yields exactly one id per execution. Skipped
  # otherwise; the harvest then falls back to no filter.
  - name: resolve_active_rules
    type: data.set
    if: "${{ steps.collect_active_rules.output.parsed_count == steps.collect_active_rules.output.expected }}"
    with:
      rule_uuids: "${{ steps.collect_active_rules.output.parsed }}"

  # Scoped to one space because the tag API writes to the space's own alerts index, so
  # a cross-space harvest would keep rediagnosing alerts it can never mark.
  # `allow_partial_results: false` because a partial aggregation would both undercount
  # fp_count and return a short alert_ids list, leaving alerts that drove a decision
  # untagged.
  # `total_count` spans every alert the rule produced in the window. `fp_rate_count`
  # includes reviewed false positives so processing a batch does not dilute the rule's
  # measured FP rate; `fp_count` and `alert_ids` include only work still to review.
  # `alert_ids` holds only the newest 100 unreviewed FPs: TOP sorts by the collected
  # value itself, so recency needs sortable `timestamp|id` keys, expanded back to
  # plain ids by stripping the fixed 18-char prefix (17-digit timestamp plus the
  # separator, hence SUBSTRING from 19). Tagging those 100 places the reviewed
  # watermark at the newest FP, which retires the older untagged ones too.
  # The DSL filter carries every per-document exclusion (window, building blocks,
  # in-flight rules), pushed down to Lucene before ES|QL sees a row. Skipping an
  # in-flight rule here, before STATS/LIMIT, frees its sweep slot for the
  # next-noisiest one; the empty-array `terms` matches nothing, which makes that
  # `must_not` a no-op — the fail-open path when the lookup errored, the parse was
  # inconsistent, or no review is pending.
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.analysis_window_days | default: consts.analysis_window_days }}d"
          must_not:
            - exists:
                field: kibana.alert.building_block_type
            - terms:
                kibana.alert.rule.uuid: "${{ steps.resolve_active_rules.output.rule_uuids | default: consts.no_rows }}"
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }} METADATA _id
        | EVAL is_fp = `kibana.alert.workflow_status` == "closed"
            AND `kibana.alert.workflow_reason` == "false_positive"
        | INLINE STATS reviewed_watermark = MAX(@timestamp)
            WHERE MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}")
          BY `kibana.alert.rule.uuid`
        | EVAL is_unreviewed_fp = is_fp
            AND (reviewed_watermark IS NULL OR @timestamp > reviewed_watermark)
        | EVAL fp_recency_key = CONCAT(DATE_FORMAT("yyyyMMddHHmmssSSS", @timestamp), "|", _id)
        | STATS total_count = COUNT(*),
            fp_rate_count = COUNT(*) WHERE is_fp,
            fp_count = COUNT(*) WHERE is_unreviewed_fp,
            last_fp_at = MAX(@timestamp) WHERE is_unreviewed_fp,
            recent_keys = TOP(fp_recency_key, {{ consts.max_diagnosis_ids }}, "desc") WHERE is_unreviewed_fp
          BY `kibana.alert.rule.uuid`
        | WHERE fp_count >= {{ inputs.min_fp_count | default: consts.min_fp_count }}
          AND fp_rate_count * 100 >= total_count * {{ inputs.min_fp_rate_pct | default: consts.min_fp_rate_pct }}
        | SORT fp_count DESC
        | LIMIT {{ consts.max_candidate_rules }}
        | MV_EXPAND recent_keys
        | EVAL alert_id = SUBSTRING(recent_keys, 19)
        | STATS fp_count = MAX(fp_count),
            last_fp_at = MAX(last_fp_at),
            alert_ids = VALUES(alert_id),
            total_count = MAX(total_count),
            fp_rate_count = MAX(fp_rate_count)
          BY `kibana.alert.rule.uuid`
        | SORT fp_count DESC
        | KEEP `kibana.alert.rule.uuid`, fp_count, last_fp_at, alert_ids, total_count, fp_rate_count
    on-failure:
      continue: true

  # Get the candidates from the harvest and the enabled rules.
  - name: collect_candidates
    type: data.set
    with:
      count: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows | size }}"
      fanout_limit: "${{ inputs.max_rules_per_sweep | default: consts.max_rules_per_sweep }}"
      filter_kql: '(alert.attributes.enabled: true) AND ({% for row in steps.harvest_fp_alerts_by_rule.output.values %}alert.id: ("alert:{{ row[0] }}"){% unless forloop.last %} OR {% endunless %}{% endfor %})'

  - name: list_enabled_candidates
    type: kibana.request
    if: "${{ steps.collect_candidates.output.count > 0 }}"
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules/_find?page=1&per_page={{ consts.max_candidate_rules }}&filter={{ steps.collect_candidates.output.filter_kql | url_encode }}"
      headers:
        elastic-api-version: "2023-10-31"
    on-failure:
      continue: true

  - name: resolve_enabled_rules
    type: data.set
    if: "${{ steps.list_enabled_candidates.output.data != null }}"
    with:
      enabled_rule_ids: "${{ steps.list_enabled_candidates.output.data | map: 'id' | join: ',' | prepend: 'enabled:' }}"

  # Only enabled rules are included in the fan-out.
  - name: resolve_fanout_rows
    type: data.set
    with:
      enabled_rule_ids: "${{ steps.resolve_enabled_rules.output.enabled_rule_ids }}"
      rows: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows | where_exp: 'row', 'steps.resolve_enabled_rules.output.enabled_rule_ids == null or steps.resolve_enabled_rules.output.enabled_rule_ids contains row[0]' | slice: 0, steps.collect_candidates.output.fanout_limit }}"

  # One review execution per rule, launched synchronously inside a parallel
  # branch so this sweep joins once every gate has settled. The gate itself cannot
  # live in this run: waitForApproval is rejected inside a parallel branch, and one
  # execution has exactly one resume slot. Each child parks on its own gate for up
  # to 72h while its branch sits in WAITING_FOR_CHILD.
  # No `timeout` or `branch-timeout` here: either one aborts the branch and cancels
  # the child while the approver is still thinking. The gate's own 72h timeout is
  # the only clock.
  - name: run_reviews
    type: parallel
    foreach: "${{ steps.resolve_fanout_rows.output.rows | default: consts.no_rows }}"
    # Settled: one dropped or failed review must not skip the other rules'
    # gates. Failures stay visible in the aggregate results and counts.
    mode: settled
    concurrency:
      # Must cover consts.max_rules_per_sweep (the input can only lower the cap)
      # so every gate opens at once.
      max: 10
      # A branch parked in WAITING_FOR_CHILD frees its slot.
      count-waiting: false
    steps:
      # ES|QL rows arrive as positional arrays in the harvest's KEEP order.
      # `${{ }}` preserves the value's type (numbers, arrays); `{{ }}` stringifies.
      - name: run_review
        type: workflow.execute
        with:
          workflow-id: system-security-rule-tuning-review
          inputs:
            rule_uuid: "{{ foreach.item.0 }}"
            fp_count: "${{ foreach.item.1 }}"
            last_fp_at: "{{ foreach.item.2 }}"
            alert_ids: "${{ foreach.item.3 }}"
            total_alert_count: "${{ foreach.item.4 }}"
            total_fp_count: "${{ foreach.item.5 }}"
            autonomy_level: "{{ inputs.autonomy_level | default: 'assisted' }}"
            analysis_window_days: "${{ inputs.analysis_window_days | default: consts.analysis_window_days }}"
            preview_invocation_count: "${{ inputs.preview_invocation_count | default: consts.preview_invocation_count }}"
            parent_run_id: "{{ execution.id }}"

  # Fan-in: every branch has settled, so each child either resolved its gate and
  # tagged its alerts, or failed (its error stays in the aggregate results). A
  # branch output is the child's workflow.output payload: rule_uuid, approved, applied.
  # Size is computed on its own because comparison operators cannot follow a filter chain.
  - name: summarize_decisions
    type: data.set
    with:
      reviews_requested: "${{ steps.resolve_fanout_rows.output.rows | size | default: 0 }}"
      reviews_failed: "${{ steps.run_reviews.output.failed | default: 0 }}"
      reviews_approved: "${{ steps.run_reviews.output.results | map: 'output' | where: 'approved' | size | default: 0 }}"
      rules_applied: "${{ steps.run_reviews.output.results | map: 'output' | where: 'applied' | size | default: 0 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      reviews_requested: "${{ steps.summarize_decisions.output.reviews_requested }}"
      reviews_approved: "${{ steps.summarize_decisions.output.reviews_approved }}"
      reviews_failed: "${{ steps.summarize_decisions.output.reviews_failed }}"
      rules_applied: "${{ steps.summarize_decisions.output.rules_applied }}"
      harvest_failed: "${{ steps.harvest_fp_alerts_by_rule.error != null }}"
