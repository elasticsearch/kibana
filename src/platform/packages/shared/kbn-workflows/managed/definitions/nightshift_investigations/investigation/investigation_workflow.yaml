version: '1'
name: Investigation
description: >
  Root cause analysis for an observability issue. One agent investigates using
  available signals — logs, traces, metrics, topology, and memory — then
  produces a structured root cause conclusion.
enabled: true
settings:
  timeout: '60m'
  concurrency:
    key: 'significant-events-investigation-{{ inputs.concurrency_key | default: execution.id }}'
    strategy: cancel-in-progress
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - investigation

triggers:
  - type: manual
    inputs:
      properties:
        message:
          type: string
          description: Description of the issue or event to investigate.
        stream_names:
          type: array
          items:
            type: string
          description: Optional logical stream names to scope observability queries.
        context:
          type: object
          additionalProperties: true
          description: Optional structured context (e.g. discovery metadata when invoked from sigevents).
        concurrency_key:
          type: string
          description: Optional key for concurrency deduplication. Defaults to the workflow execution ID.
      required:
        - message
      additionalProperties: false

steps:
  # The investigation agent is a per-space document, so it has to exist in whichever space this
  # execution runs in. Callers going through NightshiftInvestigationsClient.start() install it
  # themselves, but discovery triggers this workflow with `workflow.executeAsync`, which never
  # touches that client — as does any hand-written workflow or manual run. Ensuring it here is the
  # one place that covers every trigger. Idempotent, and it never overwrites admin edits.
  #
  # Runs before persist / emit so that a failure here does not leave a stale `running`
  # investigation record or lifecycle event. Without `on-failure: continue`, a failure also cannot leave a
  # pending marker on a significant event for an investigation that will never produce anything:
  # no `investigations` entry is written, so the next discovery cycle retries.
  - name: ensure_investigation_agent
    type: nightshift.ensureInvestigationAgent

  # Creates the investigation record for this run if it does not exist yet.
  # Runs before emit so any run that proceeds past this step is guaranteed to be visible to the
  # investigations API regardless of how it was triggered (start endpoint,
  # nightshift.triggerInvestigation step, or a direct workflow execution). Retries transient
  # failures (e.g. the execution document not yet readable right at startup), then fails the
  # run — no `continue`, so a run whose record cannot be persisted never proceeds invisibly.
  # All attributes derive from the execution document server-side; no body is needed.
  - name: persist_investigation_started
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}/_ensure'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential

  - name: emit_investigation_started
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'running'
    on-failure:
      continue: true

  - name: investigate
    type: ai.agent
    agent-id: significant-events.investigation
    # Keep connector-id-by-feature/plugin-id/aggregate-by in sync with @kbn/significant-events-schema
    # inference_feature_ids.ts (SIGNIFICANT_EVENTS_INVESTIGATION_INFERENCE_FEATURE_ID /
    # SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID).
    connector-id-by-feature: 'significant_events_investigation'
    plugin-id: 'significant_events_investigation'
    aggregate-by: 'significant_events'
    create-conversation: true
    public-conversation: true
    timeout: 1800s
    with:
      # Tag the agent execution with the workflow execution id so callers that already know
      # it (e.g. the UI, or the significant event this investigation is attached to) can look
      # up the agent execution's (auto-generated) id via findExecutions and follow its live
      # progress before this step returns.
      metadata:
        workflow_execution_id: '{{ execution.id }}'
      message: |
        Investigate the root cause of the following issue:

        {{ inputs.message }}

        {% if inputs.stream_names and inputs.stream_names.size > 0 %}
        Related streams:
        {% for stream in inputs.stream_names %}- {{ stream }}
        {% endfor %}
        {% endif %}
        {% if inputs.context.source == 'alert' %}
        This investigation was triggered by an alerting rule, so the condition that fired is
        already known — do not spend effort rediscovering it. Start from the rule condition
        stated above (the reason, and the observed value against its threshold) and work
        outwards to what caused the metric to move.

        You are not investigating a significant event. That is a separate curated entity in
        this product, not another word for an alert that matters, and none is attached here.
        Skip the step that provides trigger feedback. Omit `trigger_feedback`
        from your output entirely — do not invent severity, summary, or status changes for
        one.

        Treat the affected entity fields as the scope of the problem: filter your ES|QL queries
        to that entity first, and only widen when you need to establish whether neighbours are
        affected too. Where an index pattern is given, use it as the starting point for queries
        rather than guessing at index names.

        Where affected entity fields are given, they are the known starting point for what this
        problem impacts. The rule grouped on them, so they are established fact rather than a
        hypothesis, and every one of them is impacted unless you find evidence otherwise. Name
        them explicitly in your summary rather than leaving them implicit in the reason text, and
        use the field name as well as the value (for example "service.name checkout") so each one
        is unambiguous. Not every rule type records them, so do not invent entity fields that
        were not given to you.

        Then establish whether the impact is wider than what the rule saw. The rule only grouped
        on the fields it was configured with, so it cannot tell you about anything else that is
        affected. When you find an additional impacted entity, say what evidence identified it
        and keep it distinct from the entities the alert already named.

        Where rule parameters are given, they describe how the condition is evaluated
        (aggregation, window, and threshold). Read them before concluding that a spike is
        anomalous — a short window or a tight threshold can fire on normal variation, and "the
        rule is too sensitive" is a legitimate conclusion supported by the data.
        {% elsif inputs.context and inputs.context.size > 0 %}
        Additional context: {{ inputs.context | json }}
        {% endif %}
      # Keep this in sync with investigationStateSchema in @kbn/significant-events-schema
      # (x-pack/platform/packages/shared/kbn-significant-events-schema/src/significant_events/investigation_state.ts)
      # — this is the same schema the investigation_progress_report tool streams live, so the
      # final structured output here must match exactly (including maxLength/maxItems: the UI
      # parses the persisted result with the zod schema and rejects anything over its limits).
      schema:
        type: object
        properties:
          summary:
            type: string
            maxLength: 10000
          hypotheses:
            type: array
            maxItems: 50
            items:
              type: object
              properties:
                candidate:
                  type: string
                  maxLength: 10000
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                status:
                  type: string
                  enum: [investigating, dismissed, confirmed]
                reason:
                  type: string
                  maxLength: 10000
                evidence:
                  type: array
                  description: >
                    What this hypothesis' verdict rests on — at most 3 entries. Every hypothesis
                    that ends "confirmed" or "dismissed" must carry at least one. Only cite ES|QL
                    you actually executed, verbatim, with the absolute window it ran over; never
                    invent a query.
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                        maxLength: 10000
                        description: What was observed and why it decided this hypothesis.
                      esql_query:
                        type: string
                        maxLength: 10000
                        description: The exact ES|QL query executed to gather this evidence, when one was run.
                      time_range:
                        type: object
                        description: >
                          Absolute ISO 8601 window esql_query was evaluated over. Set it whenever
                          esql_query is set — without it the query cannot be opened in Discover.
                        properties:
                          from:
                            type: string
                            maxLength: 64
                          to:
                            type: string
                            maxLength: 64
                        required:
                          - from
                          - to
                      code:
                        type: object
                        description: The source file backing this evidence, when you read code.
                        properties:
                          source:
                            type: string
                            enum: [github_connector, code_search]
                            description: >
                              How YOU read this file — not where the code appears to be hosted.
                              "code_search" if you read it through Semantic Code Search;
                              "github_connector" if you called a GitHub connector. A repository
                              named like a GitHub project is not evidence of either.
                          repo:
                            type: string
                            maxLength: 255
                            description: Repository in owner/name form, e.g. elastic/kibana.
                          path:
                            type: string
                            maxLength: 512
                            description: Repository-relative file path.
                          host:
                            type: string
                            maxLength: 255
                            description: >
                              Hostname the code can be browsed on, copied from the origin of a URL
                              the tool returned (e.g. "github.com"). Never guess it from the
                              repository name — omit it if the tool reported no URL.
                          ref:
                            type: string
                            maxLength: 255
                            description: >
                              Commit SHA the file was read at, copied from the tool response. Omit
                              it rather than substituting a branch name.
                        required:
                          - source
                          - repo
                          - path
                    required:
                      - description
              required:
                - candidate
                - confidence
                - status
          conclusion:
            type: string
            maxLength: 10000
            description: >
              The mechanism/root-cause narrative, as plain prose — no markdown headings or bullet
              lists. Actionable steps belong in recommendations, not here.
          severity:
            type: string
            enum: ['80-critical', '60-high', '40-medium', '20-low']
            description: >
              How severe the investigated situation is, rated on the tier ladder in the agent
              instructions from what this investigation confirmed — whether the affected operation
              fails, degrades, or still completes, and how broad that impact is. Set it for every
              investigation, whatever triggered it, and rate it from your own findings rather than
              copying a severity the trigger already carried. Distinct from a
              trigger_feedback severity entry, which exists only for significant-event
              runs and rates that one event rather than the whole situation.
          recommendations:
            type: array
            description: >
              Concrete, actionable steps to resolve or mitigate the issue — prefer specific commands,
              config changes, or code over general advice like "investigate further" or "monitor the
              situation". Score how strongly the findings support that each action will help, sort
              by confidence descending, and return only the 3 strongest items.
            maxItems: 3
            items:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 512
                  description: The action itself, stated concretely (e.g. "Revert the pool-size config change").
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: How strongly the findings support that this action will resolve or mitigate the confirmed problem.
                description:
                  type: string
                  maxLength: 10000
                  description: Why this step helps, or detail needed to carry it out, when the title alone isn't enough.
                code:
                  type: string
                  maxLength: 10000
                  description: >
                    A command, config snippet, or code change backing this step, when one applies.
                    Raw source, not a fenced markdown block.
              required:
                - title
                - confidence
          blind_spots:
            type: array
            description: >
              Actionable knowledge gaps discovered during this investigation — data sources that were
              missing or inaccessible and would have helped diagnose the issue. Each item is an object:
              `title` names the missing data source concisely and could reasonably be provided (e.g.
              "No traces available for the cart service", "Infrastructure metrics absent for host X",
              "No code repository access for service Y"), and `description` states why that gap mattered
              to this investigation.
              Do NOT include incident-specific observations (e.g. "the pod crashed", "no logs during the
              outage window") — those are incident facts, not actionable knowledge gaps. Reduce the
              finding to what data source is missing and why it matters, not what happened during the incident.
              Score how strongly the findings support that closing each gap would materially improve
              the investigation, sort by confidence descending, and return only the 3 strongest items.
            maxItems: 3
            items:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 512
                  description: The missing data source or access, named concisely (e.g. "No traces for the cart service").
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: How strongly the findings support that closing this gap would materially improve the investigation.
                description:
                  type: string
                  maxLength: 10000
                  description: Why this gap mattered to the investigation.
              required:
                - title
                - confidence
                - description
          trigger_feedback:
            type: array
            description: >
              Optional feedback for the trigger based on what the investigation established. Each
              entry proposes a change to one significant-event field (severity, summary, or status)
              with a typed from/to, a one-or-two-sentence reason tied to the confirmed findings, and
              1–10 evidence items. Omit entries — or the whole array — for fields that do not need
              changing. The workflow returns this feedback but does not apply it directly; only
              propose what the listed evidence can defend. When no significant-event context was
              provided (no event_uuid in inputs.context), omit trigger_feedback entirely.
            maxItems: 3
            items:
              oneOf:
                - type: object
                  description: Propose changing the event's severity tier.
                  properties:
                    field:
                      type: string
                      const: severity
                    from:
                      type: string
                      enum: ['80-critical', '60-high', '40-medium', '20-low']
                      description: The severity from inputs.context.severity — the value before this investigation ran.
                    to:
                      type: string
                      enum: ['80-critical', '60-high', '40-medium', '20-low']
                      description: The proposed new severity tier.
                    reason:
                      type: string
                      maxLength: 10000
                      description: Why the severity should change, referencing the confirmed findings.
                    evidence:
                      type: array
                      minItems: 1
                      maxItems: 10
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                            maxLength: 10000
                            description: What was observed and why it bears on the proposed change.
                          esql_query:
                            type: string
                            maxLength: 10000
                            description: The exact ES|QL query executed to gather this evidence, when one was run.
                          time_range:
                            type: object
                            description: >
                              Absolute ISO 8601 window esql_query was evaluated over. Set it whenever
                              esql_query is set — without it the query cannot be opened in Discover.
                            properties:
                              from:
                                type: string
                                maxLength: 64
                              to:
                                type: string
                                maxLength: 64
                            required:
                              - from
                              - to
                          code:
                            type: object
                            description: The source file backing this evidence, when you read code.
                            properties:
                              source:
                                type: string
                                enum: [github_connector, code_search]
                                description: >
                                  How YOU read this file — not where the code appears to be hosted.
                                  "code_search" if you read it through Semantic Code Search;
                                  "github_connector" if you called a GitHub connector. A repository
                                  named like a GitHub project is not evidence of either.
                              repo:
                                type: string
                                maxLength: 255
                                description: Repository in owner/name form, e.g. elastic/kibana.
                              path:
                                type: string
                                maxLength: 512
                                description: Repository-relative file path.
                              host:
                                type: string
                                maxLength: 255
                                description: >
                                  Hostname the code can be browsed on, copied from the origin of a
                                  URL the tool returned (e.g. "github.com"). Never guess it from the
                                  repository name — omit it if the tool reported no URL.
                              ref:
                                type: string
                                maxLength: 255
                                description: >
                                  Commit SHA the file was read at, copied from the tool response.
                                  Omit it rather than substituting a branch name.
                            required:
                              - source
                              - repo
                              - path
                        required:
                          - description
                  required:
                    - field
                    - from
                    - to
                    - reason
                    - evidence
                - type: object
                  description: Propose rewriting the event's summary when the investigation finds it wrong or incomplete.
                  properties:
                    field:
                      type: string
                      const: summary
                    from:
                      type: string
                      maxLength: 10000
                      description: The summary from inputs.context.summary — the value before this investigation ran.
                    to:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: The corrected summary. Objective, self-contained account of the problem and impact.
                    reason:
                      type: string
                      maxLength: 10000
                      description: Why the summary is being revised and what the investigation found that prompted it.
                    evidence:
                      type: array
                      minItems: 1
                      maxItems: 10
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                            maxLength: 10000
                            description: What was observed and why it bears on the proposed change.
                          esql_query:
                            type: string
                            maxLength: 10000
                            description: The exact ES|QL query executed to gather this evidence, when one was run.
                          time_range:
                            type: object
                            description: >
                              Absolute ISO 8601 window esql_query was evaluated over. Set it whenever
                              esql_query is set — without it the query cannot be opened in Discover.
                            properties:
                              from:
                                type: string
                                maxLength: 64
                              to:
                                type: string
                                maxLength: 64
                            required:
                              - from
                              - to
                          code:
                            type: object
                            description: The source file backing this evidence, when you read code.
                            properties:
                              source:
                                type: string
                                enum: [github_connector, code_search]
                                description: >
                                  How YOU read this file — not where the code appears to be hosted.
                                  "code_search" if you read it through Semantic Code Search;
                                  "github_connector" if you called a GitHub connector. A repository
                                  named like a GitHub project is not evidence of either.
                              repo:
                                type: string
                                maxLength: 255
                                description: Repository in owner/name form, e.g. elastic/kibana.
                              path:
                                type: string
                                maxLength: 512
                                description: Repository-relative file path.
                              host:
                                type: string
                                maxLength: 255
                                description: >
                                  Hostname the code can be browsed on, copied from the origin of a
                                  URL the tool returned (e.g. "github.com"). Never guess it from the
                                  repository name — omit it if the tool reported no URL.
                              ref:
                                type: string
                                maxLength: 255
                                description: >
                                  Commit SHA the file was read at, copied from the tool response.
                                  Omit it rather than substituting a branch name.
                            required:
                              - source
                              - repo
                              - path
                        required:
                          - description
                  required:
                    - field
                    - from
                    - to
                    - reason
                    - evidence
                - type: object
                  description: >
                    Propose changing the event's status. Use "dismissed" when the investigation
                    establishes this is a false alarm or no longer relevant. Use "closed" when
                    recovery is confirmed. Use "open" if re-opening a previously closed/dismissed
                    event based on new evidence.
                  properties:
                    field:
                      type: string
                      const: status
                    from:
                      type: string
                      enum: ['open', 'closed', 'dismissed']
                      description: The status from inputs.context.status — the value before this investigation ran.
                    to:
                      type: string
                      enum: ['open', 'closed', 'dismissed']
                      description: The proposed new status.
                    reason:
                      type: string
                      maxLength: 10000
                      description: Why the status should change, referencing the confirmed findings.
                    evidence:
                      type: array
                      minItems: 1
                      maxItems: 10
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                            maxLength: 10000
                            description: What was observed and why it bears on the proposed change.
                          esql_query:
                            type: string
                            maxLength: 10000
                            description: The exact ES|QL query executed to gather this evidence, when one was run.
                          time_range:
                            type: object
                            description: >
                              Absolute ISO 8601 window esql_query was evaluated over. Set it whenever
                              esql_query is set — without it the query cannot be opened in Discover.
                            properties:
                              from:
                                type: string
                                maxLength: 64
                              to:
                                type: string
                                maxLength: 64
                            required:
                              - from
                              - to
                          code:
                            type: object
                            description: The source file backing this evidence, when you read code.
                            properties:
                              source:
                                type: string
                                enum: [github_connector, code_search]
                                description: >
                                  How YOU read this file — not where the code appears to be hosted.
                                  "code_search" if you read it through Semantic Code Search;
                                  "github_connector" if you called a GitHub connector. A repository
                                  named like a GitHub project is not evidence of either.
                              repo:
                                type: string
                                maxLength: 255
                                description: Repository in owner/name form, e.g. elastic/kibana.
                              path:
                                type: string
                                maxLength: 512
                                description: Repository-relative file path.
                              host:
                                type: string
                                maxLength: 255
                                description: >
                                  Hostname the code can be browsed on, copied from the origin of a
                                  URL the tool returned (e.g. "github.com"). Never guess it from the
                                  repository name — omit it if the tool reported no URL.
                              ref:
                                type: string
                                maxLength: 255
                                description: >
                                  Commit SHA the file was read at, copied from the tool response.
                                  Omit it rather than substituting a branch name.
                            required:
                              - source
                              - repo
                              - path
                        required:
                          - description
                  required:
                    - field
                    - from
                    - to
                    - reason
                    - evidence
          impact:
            type: object
            description: >
              Structured account of which services or components were impacted. At most 10 entries,
              service-level preferred. Each entity carries one optional evidence artifact (an ES|QL
              query with absolute time window preferred) for chart rendering — description is a short
              label only. Seed from alert grouping or sig event causal features; finalize after
              hypotheses are settled. Omit only when no signals exist.
            properties:
              entities:
                type: array
                maxItems: 10
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 512
                    type:
                      type: string
                      maxLength: 255
                      description: >
                        Entity category. Default to "service". Use "host", "database", etc. only when
                        no service-level entity applies.
                    feature_id:
                      type: string
                      maxLength: 255
                      description: KI feature_id when this entity came from a Knowledge Indicator.
                    stream_name:
                      type: string
                      maxLength: 255
                    evidence:
                      type: object
                      description: >
                        One artifact linking this entity to the investigation. Prefer esql_query +
                        time_range (absolute ISO 8601) so the UI can render a chart. description is
                        a short label — no prose explanation of impact.
                      properties:
                        description:
                          type: string
                          maxLength: 10000
                        esql_query:
                          type: string
                          maxLength: 10000
                        time_range:
                          type: object
                          properties:
                            from:
                              type: string
                              maxLength: 64
                            to:
                              type: string
                              maxLength: 64
                          required:
                            - from
                            - to
                        code:
                          type: object
                          properties:
                            source:
                              type: string
                              enum: [github_connector, code_search]
                            repo:
                              type: string
                              maxLength: 255
                            path:
                              type: string
                              maxLength: 512
                            host:
                              type: string
                              maxLength: 255
                            ref:
                              type: string
                              maxLength: 255
                          required:
                            - source
                            - repo
                            - path
                      required:
                        - description
                  required:
                    - name
            required:
              - entities
          canvas:
            type: string
            description: >
              Optional static JSX string for visual rendering in the investigation canvas.
              Generated via react-jsx-parser. Use for visualizing numerical findings such as
              error counts, latency, or service comparisons. Omit for purely narrative conclusions.
            maxLength: 100000
        required:
          - summary
          - hypotheses
    on-failure:
      continue: true

  # Persists the investigation structured output onto the investigation record.
  # Runs after `investigate` when the agent completed successfully. Writes completed status +
  # all structured output fields. Retries transient failures, then fails the run: a completed
  # investigation whose record cannot be written must not be lost silently. The persist route
  # is idempotent — the progress report tool may have already set status to 'running'.
  # Trigger write-back lives in the significant-events investigation_completed subscriber,
  # not here — applying it in both places would double-write.
  - name: persist_investigation_completed
    type: kibana.request
    if: '${{ steps.investigate.error == null }}'
    with:
      method: PATCH
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: "completed"
        summary: "${{ steps.investigate.output.structured_output.summary }}"
        conclusion: "${{ steps.investigate.output.structured_output.conclusion }}"
        severity: "${{ steps.investigate.output.structured_output.severity }}"
        hypotheses: ${{ steps.investigate.output.structured_output.hypotheses }}
        recommendations: ${{ steps.investigate.output.structured_output.recommendations }}
        blind_spots: ${{ steps.investigate.output.structured_output.blind_spots }}
        trigger_feedback: ${{ steps.investigate.output.structured_output.trigger_feedback }}
        impact: ${{ steps.investigate.output.structured_output.impact }}
        canvas: "${{ steps.investigate.output.structured_output.canvas }}"
        conversation_id: "${{ steps.investigate.output.conversation_id }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential

  # Persists failure status when the investigate step errored. Retries transient failures,
  # then fails the run: an investigation whose record cannot be written must not be lost silently.
  - name: persist_investigation_failed
    type: kibana.request
    if: '${{ steps.investigate.error != null }}'
    with:
      method: PATCH
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: "failed"
        error: "${{ steps.investigate.error.message | default: 'Investigation failed' }}"
        conversation_id: "${{ steps.investigate.output.conversation_id }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential

  # Reconcile the gaps this investigation surfaced into the _gaps/overview memory
  # page. Deliberately minimal: a cheap model, memory read/write only, no auditing.
  # connector-id-by-feature: shared memory connector (SIGNIFICANT_EVENTS_MEMORY_INFERENCE_FEATURE_ID).
  # plugin-id: step-specific cost attribution; aggregate-by: SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID.
  - name: merge_investigation_gaps
    type: ai.agent
    connector-id-by-feature: 'significant_events_memory'
    plugin-id: 'significant_events_memory_investigation_gaps'
    aggregate-by: 'significant_events'
    create-conversation: false
    timeout: 120s
    with:
      message: |
        Call load_skill with path skills/platform/streams/significant-events-memory to get the memory tools.

        The following knowledge gaps were identified during an investigation, as JSON objects each carrying a `title` (the missing data source, named concisely), `confidence` (its relevance to the investigation), and a `description` (why that gap mattered):

        {{ steps.investigate.output.structured_output.blind_spots | json }}

        Keep only gaps whose `title` is an actionable structural deficiency — a data source or access that is missing and could reasonably be provided (e.g. "No traces for the cart service", "No infrastructure metrics for host X", "No code repository access for service Y"). Discard incident-specific observations that just describe what happened during the outage (e.g. "the pod crashed", "no logs during the failure window").

        Read the current _gaps/overview page with platform_sig_events_memory_read. Compare the filtered gaps against it. If every gap is already reflected there, stop and write nothing. If there are genuinely new gaps, weave them into the existing sections (do not add a separate section) and save the page with platform_sig_events_memory_write using categories ["_system/gaps"].
    on-failure:
      continue: true

  - name: emit_investigation_completed
    type: kibana.request
    if: '${{ steps.investigate.error == null }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'completed'
    on-failure:
      continue: true

  - name: emit_investigation_failed
    type: kibana.request
    if: '${{ steps.investigate.error != null }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'failed'
    on-failure:
      continue: true

  - name: fail_investigation
    type: workflow.fail
    if: '${{ steps.investigate.error != null }}'
