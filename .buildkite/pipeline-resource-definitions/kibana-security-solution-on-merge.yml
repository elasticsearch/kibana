# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-security-solution-on-merge
  description: 'Runs the Security Solution Cypress test suites after changes merge'
  links:
    - url: 'https://buildkite.com/elastic/kibana-security-solution-on-merge'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:security-engineering-productivity'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / security solution / on merge
      description: 'Runs the Security Solution Cypress test suites after changes merge'
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#sdh-security-team'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'false'
        SLACK_NOTIFICATIONS_SKIP_FOR_RETRIES: 'true'
        REPORT_FAILED_TESTS_TO_GITHUB: 'true'
        SCOUT_REPORTER_ENABLED: 'true'
      allow_rebuilds: true
      branch_configuration: main 9.5 9.4 8.19
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/security_solution_on_merge.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/security_solution_on_merge.yml
            cleanup_sparse_state: true
      skip_intermediate_builds: false
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        build_tags: false
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        security-engineering-productivity:
          access_level: MANAGE_BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      tags:
        - kibana
        - security-solution
